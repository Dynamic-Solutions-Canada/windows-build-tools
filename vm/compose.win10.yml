# Windows 10 22H2 test VM. For installing and exercising apps whose minimum is Windows 10 22H2
# (build 19045), not for building: builds use compose.yml. It normally runs on the home server;
# vm/remote.sh sets the storage, OEM and RDP port below. Start on demand and stop afterwards
# (from the repo root):
#   vm/remote.sh up win10      # normally, on the home server
#   vm/remote.sh down win10
#   docker compose -f vm/compose.win10.yml up -d    # local fallback under WSL's nested KVM
#   docker compose -f vm/compose.win10.yml stop
# Never run it alongside the Windows 11 build VM (on the same host) or the Android VM.
# Shares the build VM's guest password and SSH key list (outside version control).
name: windows10-test
services:
  windows:
    # Same pinned image as the build VM; check Docker Hub before bumping.
    image: dockurr/windows:6.06
    container_name: windows10-test
    env_file:
      - ${HOME}/.secrets/windows-build-tools/windows-dev/vm.env
    environment:
      # Windows 10 Pro 22H2 (build 19045), the family's minimum (D-018).
      VERSION: "10"
      # The image runs QEMU with "-rtc base=localtime", so the guest's hardware clock holds this
      # container's local time. oem/guest-clock.ps1 sets the guest to the matching Eastern time
      # zone; without both, a UTC container and the image's default Pacific guest boot 8 hours ahead.
      TZ: "America/Toronto"
      # Smaller than the build VM: it only runs the app under test. A 3G guest under a 3.5G hard
      # cap; vm/remote.sh checks the server's free memory, and for the local fallback check
      # `free -m` first and keep WSL's 2.5 GiB safety margin.
      RAM_SIZE: "3G"
      # The image's own RAM check measures free memory inside the container, where file cache from
      # the ISO download counts as used; after the first download it shrank the guest to 54 MB and
      # refused to boot. The hard container cap below is the real limit, so skip the guess.
      RAM_CHECK: "N"
      CPU_CORES: "4"
      DISK_SIZE: "64G"
    mem_limit: 3584m
    memswap_limit: 3584m
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    # Loopback only, on ports beside the build VM's so both configurations can exist.
    ports:
      - 127.0.0.1:8007:8006
      - 127.0.0.1:${WINDOWS_VM_RDP_PORT:-3390}:3389/tcp
      - 127.0.0.1:${WINDOWS_VM_RDP_PORT:-3390}:3389/udp
      - 127.0.0.1:2230:22
    volumes:
      # vm/remote.sh points these at the home server; unset, they are this machine's (the fallback).
      - ${WINDOWS_VM_STORAGE:-${HOME}/.local/share/windows10-test/storage}:/storage
      - ${WINDOWS_VM_OEM:-./oem}:/oem:ro
    restart: "no"
    stop_grace_period: 2m
